services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cbir_user
      POSTGRES_PASSWORD: cbir_pass
      POSTGRES_DB: fruit_cbir
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbir_user -d fruit_cbir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
